<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro‘yxatdan o‘tish — IT Academy</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <a href="index.html" class="logo auth-logo">
        <span>&lt;/&gt;</span> IT Academy
    </a>

    <div class="auth-card">

        <h1>Hisob yaratish</h1>

        <p class="auth-description">
            IT Academy platformasiga qo‘shiling va
            o‘rganishni boshlang.
        </p>

        <form id="registerForm">

            <label>Ism va familiya</label>
            <input
                type="text"
                id="registerName"
                placeholder="Masalan: Sultanbay Ayitmuradov"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="example@gmail.com"
                required
            >

            <label>Parol</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="Kamida 6 ta belgi"
                required
            >

            <label>Yo‘nalish</label>

            <select id="registerCourse" required>
                <option value="">Yo‘nalishni tanlang</option>
                <option>Frontend Development</option>
                <option>JavaScript</option>
                <option>Python</option>
                <option>UI/UX Design</option>
            </select>

            <button type="submit" class="auth-submit">
                Ro‘yxatdan o‘tish
            </button>

        </form>

        <p class="auth-footer">
            Hisobingiz bormi?
            <a href="login.html">Kirish</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
